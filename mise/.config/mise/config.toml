[tool_alias]
# Short names for prefixed backends so `mise up pi` and friends work.
pi = "npm:@earendil-works/pi-coding-agent"
jj-starship = "github:dmmulroy/jj-starship"

[tools]
bat = "latest"
buf = "latest"
cmake = "latest"
delta = "latest"
eza = "latest"
fd = "latest"
fzf = "latest"
gh = "latest"
git-lfs = "latest"
jj-starship = "0.7.1"
jj = "latest"
jq = "latest"
lazygit = "latest"
lua-language-server = "latest"
neovim = "latest"
ninja = "latest"
node = "lts"
pi = "latest"
pnpm = "latest"
python = "latest"
ripgrep = "latest"
rust = "1.96.1"
shellcheck = "latest"
shfmt = "latest"
starship = "latest"
stylua = "latest"
tree-sitter = "latest"
# Herdr's vendored libghostty-vt requires this Zig line; see herdr-patched-update.
zig = "0.15.2"
zoxide = "latest"

[settings]
idiomatic_version_file_enable_tools = ["node"]
