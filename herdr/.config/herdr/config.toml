# herdr configuration
# https://herdr.dev

[keys]
# Prefix key to enter prefix mode (default: "ctrl+b")
prefix = "ctrl+s"
# Open settings with prefix+,. Double-prefix toggles focused-pane zoom.
settings = "prefix+comma"
zoom = "prefix+ctrl+s"
# Default is prefix+v; use | like tmux's vertical split.
split_vertical = "prefix+|"
# Direct pane navigation, no prefix required.
focus_pane_left = "ctrl+h"
focus_pane_down = "ctrl+j"
focus_pane_up = "ctrl+k"
focus_pane_right = "ctrl+l"
# Focus workspaces 1-8 by sidebar position; 9 focuses the last workspace.
switch_workspace = "cmd+1..9"
# Focus agents 1-8 by panel position; 9 focuses the last agent.
focus_agent = "cmd+shift+1..9"
# Cycle through workspaces in sidebar order.
previous_workspace = "cmd+shift+["
next_workspace = "cmd+shift+]"
# Focus the workspace or agent list for keyboard navigation.
workspace_picker = "prefix+w"
agent_picker = "prefix+a"
navigate_workspace_up = ["up", "k"]
navigate_workspace_down = ["down", "j"]

[theme]
name = "tokyo-night"
auto_switch = false

[ui.sidebar.agents]
# Show only attention state plus the custom agent name or workspace-root fallback.
rows = [["state_icon", "agent"]]
row_gap = 0
